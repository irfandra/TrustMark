spring:
  application:
    name: trustmark-backend

  datasource:
    url: jdbc:mysql://mysql:3306/${DB_NAME:trustmark}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DATABASE_MODE:validate}
    show-sql: true
    properties:
      "[hibernate.format_sql]": true
      "[hibernate.dialect]": org.hibernate.dialect.MySQL8Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true
            required: true

# App Configuration
app:
  mail:
    from: ${MAIL_FROM:noreply@trustmark.app}
    from-name: TrustMark

# CORS Configuration
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8081,http://192.168.1.2:8080}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  show-actuator: false

management:
  health:
    mail:
      enabled: false # mail SMTP not available in dev; don't fail the health check
  endpoint:
    health:
      show-details: always

logging:
  file:
    name: logs/trustmark.log
  pattern:
    # Console: timestamp level [THREAD] --- message
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level --- %msg%n"
    # File: same pattern — grep by [CATEGORY] or level
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level --- %msg%n"
  level:
    "[com.digitalseal]": INFO
    "[org.springframework.security]": WARN
    "[org.hibernate.SQL]": WARN
    "[org.flywaydb]": INFO
