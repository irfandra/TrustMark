name: trustmark-stack

services:
  mysql:
    image: mysql:8.0
    container_name: trustmark-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-trustmark_password}
      MYSQL_DATABASE: ${DB_NAME:-trustmark}
      MYSQL_USER: ${DB_USERNAME:-trustmark_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-trustmark_password}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - trustmark_mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD:-trustmark_password}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - trustmark_net

  backend:
    image: trustmark-backend:local
    build: .
    container_name: trustmark-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8082}:8080"
    environment:
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-trustmark_password}
      DB_NAME: ${DB_NAME:-trustmark}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8081}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - trustmark_net

volumes:
  trustmark_mysql_data:
    driver: local

networks:
  trustmark_net:
    name: trustmark_net
