version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: digital-seal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ds_password}
      MYSQL_DATABASE: digital_seal
      MYSQL_USER: ${DB_USERNAME:-ds_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ds_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD:-ds_password}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # Hardhat Local Blockchain
  hardhat:
    image: node:20-alpine
    container_name: digital-seal-hardhat
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../blockchain:/app
    ports:
      - "8545:8545"
    command: >
      sh -c "
        npm install &&
        npx hardhat node --hostname 0.0.0.0
      "
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:8545'', r => process.exit(r.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Spring Boot Backend
  backend:
    build: .
    container_name: digital-seal-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-change-this-in-production-12345678901234567890}
      WEB3_RPC_URL: ${WEB3_RPC_URL:-http://localhost:8545}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8081}
    depends_on:
      mysql:
        condition: service_healthy
      hardhat:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
